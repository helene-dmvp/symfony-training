overblog_graphql:
    definitions:
        schema:
            main:
                query: Query
                mutation: Mutation
        mappings:
            types:
                - type: yaml
                  dir: '%kernel.project_dir%/config/graphql'
    errors_handler:
        enabled: true
        rethrow_internal_exceptions: true
    security:
        query_max_complexity: 1000
