framework:
    messenger:
        failure_transport: failed
        default_bus: command.bus

        transports:
            sync: 'sync://'
            # ajout de méthode asynchrone
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy:
                    max_retries: 2
                    delay: 1000
            failed: '%env(ASYNC_DSN_FAILURE)%'

        routing:
            Domain\Event\DinosaurIsBorn: async

        buses:
            command.bus:
                default_middleware: true
                middleware:
                    - Infrastructure\Symfony\Messenger\Middleware\DomainEventDispatcher
                    - dispatch_after_current_bus
                    - doctrine_transaction
            query.bus: ~
            event.bus:
                default_middleware: allow_no_handlers
                middleware:
                    - dispatch_after_current_bus
                    - doctrine_transaction
